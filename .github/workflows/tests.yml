name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      with:
        lfs: true
    
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167
      with:
        environment-file: bmadQPADCondaEnv_dev.yml
        activate-environment: bmad-qpad-dev
    
    - name: Install package
      run: |
        pip install -e .
      shell: bash -l {0}
    
    - name: Run fast tests
      run: |
        pytest tests/ -m "not slow and not requires_tao" -v
      shell: bash -l {0}
    
    # - name: Run all tests (including slow)
    #   run: |
    #     pytest tests/ -v
    #   if: github.event_name == 'pull_request'
    #   shell: bash -l {0}
    
